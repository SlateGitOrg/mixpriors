[project]
name = "mixpriors"
version = "0.1.0"
description = "A Bayesian media mix model whose budget optimiser maximises expected return under the posterior, not under a point estimate."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
